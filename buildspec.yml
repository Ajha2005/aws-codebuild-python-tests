
version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo Installing dependencies...
      - pip install -r requirements.txt

  pre_build:
    commands:
      - echo Starting pre-build phase...
      - python --version
      - pip --version

  build:
    commands:
      - echo Running unit tests...
      - pytest -v

  post_build:
    commands:
      - echo Build and testing completed.

artifacts:
  files:
    - app.py
    - requirements.txt
    - tests/**/*
    - buildspec.yml
